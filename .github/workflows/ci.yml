name: CI

# The outer, authoritative gate (ARCHITECTURE.md §4, Rule 3). Runs the full
# tier ladder on every PR ref; branch protection makes this the check of record.
# Forge's green-baseline law (#214): this gate is wired only because it is green
# on HEAD. The in-loop sandbox.exec() gates are advisory; this is the verdict.
#
# No devbox job yet — Forge's environment.devbox is false at bootstrap; a
# Devbox/Nix-backed environment is a later opt-in, not a scaffold requirement.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fleet no-op merge guard (toon-meta#405), wired INTO this repo's aggregate
  # required check so that it blocks a HUMAN merge and not just the fleet
  # auto-merge pass (toon-meta#408). connector#1008 merged green, closed its
  # ticket and changed zero files -- and it was a human who merged it, because
  # a red NON-required check is only a warning on the merge button. This
  # replaces the stand-alone empty-pr-guard-shim.yml, deleted in the same
  # commit; running both would put two identical "No-op merge guard" check
  # runs on every PR. Canonical caller snippet and full rationale:
  # toon-meta scripts/factory/empty-pr-guard-gate-job.yml.
  #
  # No `secrets: inherit` -- the guard makes no API call and no write of any
  # kind, so handing it FACTORY_OPS_TOKEN would widen a monitored credential
  # for nothing. No `if:` either: this workflow also runs on push, where the
  # guard passes with a plain "no merge result to evaluate"; a job-level `if:`
  # would make it `skipped` there, and a skipped gating job must never read as
  # a pass (toon-meta#279).
  no-op-merge:
    uses: toon-protocol/toon-meta/.github/workflows/empty-pr-guard.yml@main

  gate:
    runs-on: ubuntu-latest
    # `needs:` on its own would block nothing: a job skipped because a `needs:`
    # dependency failed reports conclusion `skipped`, and branch protection
    # treats a skipped required check as a PASS. `if: always()` keeps this job
    # running and reporting whatever the guard did, and the first step below is
    # what actually fails it.
    needs: [no-op-merge]
    if: always()
    steps:
      - name: The no-op merge guard must have passed
        env:
          NO_OP_MERGE: ${{ needs.no-op-merge.result }}
        run: |
          [ "$NO_OP_MERGE" = "success" ] || {
            echo "::error::no-op merge guard result is '$NO_OP_MERGE' (expected 'success') — see the 'No-op merge guard' job. Merging this PR would change nothing."
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      - name: format
        run: pnpm format:check
