# golden-regen — regenerates oracle-protected golden fixtures
# (ARCHITECTURE.md §3 rule 4 / FACTORY_SPEC.md §6 `[privileged]`).
#
# `workflow_dispatch` only — this trigger is intentionally the ONLY one on
# this workflow; it must never fire on a `pull_request` or `push`. It is also
# gated behind the `oracle-owners` GitHub environment, which GitHub enforces
# required reviewers on before this job's environment secrets/token are
# released. This is the only path golden fixtures may change through — a
# feature PR hand-editing them is invalid by construction
# (CODING_STANDARDS.md "Testing"). A repo declaring any `protected = true`
# tier MUST declare this operation in `factory.toml`'s `[privileged]` table
# (FACTORY_SPEC.md §6/§8.7), or its protected fixtures could only be
# regenerated by an ordinary PR — defeating the protection.

name: golden-regen

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the goldens are being regenerated (lands in the commit + PR body)
        required: true
        type: string

jobs:
  regen:
    name: Regenerate golden fixtures
    runs-on: ubuntu-latest
    environment: oracle-owners
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each factory names its own regen command; the org convention is a
      # `golden:regen` package.json script that writes fixtures under
      # verify/**/golden/ (or this repo's declared protected zone).
      - name: Regenerate goldens
        run: pnpm run golden:regen

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open golden-regen PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No golden fixture changes to regenerate."
            exit 0
          fi

          branch="golden-regen/${{ github.run_id }}"
          git checkout -b "$branch"
          git config user.name "toon-backlog-bot"
          git config user.email "toon-backlog-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate golden fixtures" -m "$REASON"
          git push -u origin "$branch"
          body=$'Regenerated via golden-regen.yml (oracle-owners approved).\n\nReason: '"$REASON"
          gh pr create \
            --title "chore: regenerate golden fixtures" \
            --body "$body"
